# Must sort before every named application virtual host.
<VirtualHost *:80>
    ServerName default.invalid
    RewriteEngine On
    RewriteRule ^ - [R=404,L]
    ErrorDocument 404 "Not Found"
</VirtualHost>
<VirtualHost *:443>
    ServerName default.invalid
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/cs2inventory.cn/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cs2inventory.cn/privkey.pem
    RewriteEngine On
    RewriteRule ^ - [R=404,L]
    ErrorDocument 404 "Not Found"
</VirtualHost>
