# Canonical-domain routing. Install after the SAN certificate is available.
<VirtualHost *:80>
    ServerName cs2inventory.cn
    ServerAlias www.cs2inventory.cn
    Include /etc/apache2/cs2-retired-paths.conf
    Alias /.well-known/acme-challenge/ /var/www/cs2-acme/.well-known/acme-challenge/
    <Directory /var/www/cs2-acme/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://cs2inventory.cn%{REQUEST_URI} [R=308,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName cs2inventory.cn
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/cs2inventory.cn/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cs2inventory.cn/privkey.pem
    Include /etc/apache2/cs2-retired-paths.conf
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5060/ connectiontimeout=5 timeout=240
    ProxyPassReverse / http://127.0.0.1:5060/
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    ErrorLog ${APACHE_LOG_DIR}/cs2-domain-error.log
    CustomLog ${APACHE_LOG_DIR}/cs2-domain-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName www.cs2inventory.cn
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/cs2inventory.cn/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cs2inventory.cn/privkey.pem
    Include /etc/apache2/cs2-retired-paths.conf
    RewriteRule ^ https://cs2inventory.cn%{REQUEST_URI} [R=308,L,NE]
</VirtualHost>
