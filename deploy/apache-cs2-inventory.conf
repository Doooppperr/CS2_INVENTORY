# Insert these directives in the IP-only VirtualHost. Apache removes the prefix
# before proxying, while the browser keeps relative API URLs under it.
ProxyPass /cs2_inventory/ http://127.0.0.1:5060/ connectiontimeout=5 timeout=240
ProxyPassReverse /cs2_inventory/ http://127.0.0.1:5060/
RedirectMatch 302 ^/cs2_inventory$ /cs2_inventory/
