[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-inventory-monitor"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.2",
  "Flask-SQLAlchemy==3.1.1",
  "SQLAlchemy==2.0.43",
  "alembic==1.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = ["src/cs2_inventory/inventory_engine.py", "tests/test_inventory_engine.py", "tests/test_legacy_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
