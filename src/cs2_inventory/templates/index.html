<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CS2 Inventory Monitor</title>
  <style>
    :root{--bg:#07111f;--panel:#101c2e;--line:#263a54;--text:#f3f7fc;--muted:#91a2b8;--blue:#5aa9ff;--green:#37d39a;--red:#ff7285;--amber:#ffbf5b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#142948 0,#07111f 46%);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif;min-height:100vh}button,input,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand h1{margin:0;font-size:26px}.brand p{margin:4px 0 0;color:var(--muted)}.panel{background:#101c2ee8;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 60px #0004}.auth{max-width:440px;margin:10vh auto}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button,.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button{border:0;border-radius:10px;background:var(--blue);color:#04111f;font-weight:700;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.tabs button.active{color:var(--text);border-color:var(--blue)}label{display:block;color:var(--muted);margin:12px 0 6px}input,select{width:100%;padding:11px 12px;background:#081525;color:var(--text);border:1px solid var(--line);border-radius:10px}.full{width:100%;margin-top:18px}.notice{padding:12px 15px;border:1px solid #8a6926;background:#372a0f;border-radius:11px;color:#ffe0a2;margin-bottom:18px}.error{color:var(--red)}.success{color:var(--green)}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar>div{flex:1;min-width:240px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:15px;border-radius:14px;background:#091625;border:1px solid var(--line)}.stat span{color:var(--muted);display:block}.stat b{font-size:25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);background:#0a1727;border-radius:14px;padding:16px;cursor:pointer}.card:hover{border-color:var(--blue)}.card h3{margin:0 0 8px;font-size:17px}.meta{color:var(--muted);font-size:13px}.pill{display:inline-block;border-radius:99px;padding:3px 9px;background:#183149;color:#9bcaff;font-size:12px}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:18px}.hidden{display:none!important}.detail-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.items{margin-top:14px;border-top:1px solid var(--line)}.row{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #1b2c42}.qty{color:var(--blue);font-weight:700}.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.diff>div{padding:12px;background:#091625;border-radius:10px}.admin{margin-top:20px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.user-row{padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:760px){.stats,.grid,.admin-grid,.diff{grid-template-columns:1fr}.top{align-items:flex-start}.shell{padding:18px 12px}}
  </style>
</head>
<body><main class="shell">
  <section id="auth" class="panel auth">
    <div class="brand"><h1>CS2 Inventory</h1><p>登录后查看自动更新的统一库存快照</p></div>
    <div class="tabs"><button id="loginTab" class="active">登录</button><button id="registerTab">注册</button></div>
    <form id="authForm"><label>用户名</label><input id="username" autocomplete="username" required><label>密码</label><input id="password" type="password" autocomplete="current-password" required><button class="full" id="authSubmit">登录</button></form>
    <p id="authMessage"></p>
  </section>

  <section id="app" class="hidden">
    <header class="top"><div class="brand"><h1>CS2 Inventory Monitor</h1><p id="welcome"></p></div><div><button id="changePassword" class="ghost">修改密码</button> <button id="logout" class="ghost">退出登录</button></div></header>
    <div id="maintenance" class="notice hidden"></div>
    <section class="panel">
      <div class="toolbar"><div><label>添加 SteamID64 监控</label><input id="steamid" maxlength="17" inputmode="numeric" placeholder="7656119xxxxxxxxxx"></div><button id="addMonitor">添加监控</button></div>
      <p id="message"></p>
      <div class="stats"><div class="stat"><span>我的监控</span><b id="myCount">0</b></div><div class="stat"><span>平台目标</span><b id="platformCount">0 / 35</b></div><div class="stat"><span>库存总量</span><b id="inventoryTotal">0</b></div><div class="stat"><span>最近更新</span><b id="lastUpdate" style="font-size:15px">—</b></div></div>
      <div id="monitorGrid" class="grid"></div><div class="pager"><button id="prev" class="ghost">上一页</button><span id="pageLabel">1 / 1</span><button id="next" class="ghost">下一页</button></div>
    </section>

    <section id="detail" class="panel hidden" style="margin-top:20px">
      <div class="detail-head"><div><h2 id="detailTitle" style="margin:0"></h2><p id="detailMeta" class="meta"></p></div><div><button id="deleteMonitor" class="ghost">取消监控</button> <button id="closeDetail" class="ghost">关闭</button></div></div>
      <div class="stats"><div class="stat"><span>物品总数</span><b id="detailTotal">0</b></div><div class="stat"><span>物品种类</span><b id="detailTypes">0</b></div><div class="stat"><span>查询耗时</span><b id="detailElapsed">0s</b></div><div class="stat"><span>快照时间</span><b id="detailTime" style="font-size:14px">—</b></div></div>
      <label>历史快照</label><select id="history"></select><div id="diff" class="diff"></div><div id="itemRows" class="items"></div>
    </section>

    <section id="admin" class="panel admin hidden">
      <h2>管理员控制台</h2><div class="admin-grid"><div><h3>平台状态</h3><div id="adminStatus"></div><h3>即时查询</h3><div class="toolbar"><div><input id="adminSteamid" maxlength="17" placeholder="SteamID64"></div><button id="adminQuery">查询</button></div><p id="adminQueryResult" class="meta"></p></div><div><h3>用户</h3><div id="users"></div></div><div><h3>全部监控目标</h3><div id="adminTargets"></div></div></div>
    </section>
  </section>
</main>
<script>
const state={csrf:'',user:null,page:1,pages:1,register:false,currentTarget:null,detailAdminView:false};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){options.headers={...(options.headers||{}),'X-CSRF-Token':state.csrf};if(options.body&&!options.headers['Content-Type'])options.headers['Content-Type']='application/json';const r=await fetch(path,options);const d=await r.json().catch(()=>({error:'响应格式错误'}));if(!r.ok)throw new Error(d.error||`请求失败 ${r.status}`);return d}
function fmt(value){return value?new Date(value).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'—'}
function msg(text,ok=false){$('message').className=ok?'success':'error';$('message').textContent=text||''}
function setAuthMode(register){state.register=register;$('loginTab').classList.toggle('active',!register);$('registerTab').classList.toggle('active',register);$('authSubmit').textContent=register?'注册':'登录';$('password').autocomplete=register?'new-password':'current-password'}
async function boot(){const d=await api('api/bootstrap');state.csrf=d.csrf_token;state.user=d.user;$('maintenance').classList.toggle('hidden',!d.maintenance);$('maintenance').textContent=d.maintenance_message;if(state.user){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent=`${state.user.username} · ${state.user.role==='admin'?'管理员':'用户'}`;$('admin').classList.toggle('hidden',state.user.role!=='admin');await loadMonitors();if(state.user.role==='admin')await loadAdmin()}else{$('auth').classList.remove('hidden');$('app').classList.add('hidden')}}
async function loadMonitors(){const d=await api(`api/monitors?page=${state.page}`);state.pages=Math.max(1,d.pages);$('myCount').textContent=d.total;$('platformCount').textContent=`${d.platform_targets} / ${d.platform_limit}`;$('pageLabel').textContent=`${d.page} / ${state.pages}`;$('prev').disabled=d.page<=1;$('next').disabled=d.page>=state.pages;let total=0,last=null;d.items.forEach(x=>{if(x.latest)total+=x.latest.total_items;if(x.last_success_at&&(!last||x.last_success_at>last))last=x.last_success_at});$('inventoryTotal').textContent=total;$('lastUpdate').textContent=fmt(last);$('monitorGrid').innerHTML=d.items.length?d.items.map(x=>`<article class="card" data-id="${x.id}"><h3>${esc(x.label)}</h3><span class="pill">${esc(x.scan_status)}</span><p class="meta">库存 ${x.latest?x.latest.total_items:'—'} 件 · ${fmt(x.last_success_at)}</p>${x.last_error?`<p class="error">${esc(x.last_error)}</p>`:''}</article>`).join(''):'<p class="meta">尚未添加监控。</p>';$('monitorGrid').querySelectorAll('.card').forEach(el=>el.onclick=()=>openDetail(Number(el.dataset.id)))}
async function openDetail(id,adminView=false){const d=await api(`api/monitors/${id}`);state.currentTarget=id;state.detailAdminView=adminView;$('deleteMonitor').classList.toggle('hidden',adminView);$('detail').classList.remove('hidden');$('detailTitle').textContent=d.monitor.label;$('detailMeta').textContent=d.monitor.last_error||(adminView?'管理员全局快照视图':'');$('history').innerHTML=d.history.map(x=>`<option value="${x.id}">${fmt(x.scanned_at)}</option>`).join('');if(d.snapshot)renderSnapshot(d.snapshot,{added:[],removed:[],changed:[]});else{$('itemRows').innerHTML='<p class="meta">首次扫描尚未完成。</p>';$('diff').innerHTML=''}$('detail').scrollIntoView({behavior:'smooth'})}
function renderSnapshot(s,diff){$('detailTotal').textContent=s.total_items;$('detailTypes').textContent=s.item_types;$('detailElapsed').textContent=`${(s.elapsed_ms/1000).toFixed(1)}s`;$('detailTime').textContent=fmt(s.scanned_at);$('itemRows').innerHTML=(s.items||[]).map(x=>`<div class="row"><span>${esc(x.name)}</span><span class="qty">× ${x.count}</span></div>`).join('')||'<p class="meta">暂无物品</p>';$('diff').innerHTML=`<div><b>新增</b><p>${diff.added.map(x=>`${esc(x.name)} ×${x.count}`).join('<br>')||'无'}</p></div><div><b>移除</b><p>${diff.removed.map(x=>`${esc(x.name)} ×${x.count}`).join('<br>')||'无'}</p></div><div><b>数量变化</b><p>${diff.changed.map(x=>`${esc(x.name)} ${x.before} → ${x.after}`).join('<br>')||'无'}</p></div>`}
async function loadAdmin(){const [s,u,t]=await Promise.all([api('api/admin/status'),api('api/admin/users'),api('api/admin/targets')]);$('adminStatus').innerHTML=`<p>监控：${s.targets}/${s.target_limit}</p><p>等待任务：${s.pending_jobs}</p><p>今日额度：${s.quota.daily_used}/${s.quota.daily_budget}</p><p>账期额度：${s.quota.billing_used}/${s.quota.billing_budget}</p>`;$('users').innerHTML=u.items.map(x=>`<div class="user-row"><b>${esc(x.username)}</b> · ${esc(x.role)} · ${x.monitor_count} 个监控<br><span class="meta">${x.steamids.map(esc).join(', ')||'无'}</span><br><button class="ghost user-toggle" data-id="${x.id}" data-active="${x.is_active}">${x.is_active?'停用':'启用'}</button> <button class="ghost user-reset" data-id="${x.id}">重置密码</button></div>`).join('');$('users').querySelectorAll('.user-toggle').forEach(b=>b.onclick=()=>adminPatchUser(Number(b.dataset.id),{is_active:b.dataset.active!=='true'}));$('users').querySelectorAll('.user-reset').forEach(b=>b.onclick=()=>{const p=prompt('输入至少 8 位的新密码');if(p)adminPatchUser(Number(b.dataset.id),{new_password:p})});$('adminTargets').innerHTML=t.items.map(x=>`<div class="user-row"><b>${esc(x.label)}</b> · ${x.subscriber_count} 个订阅<br><span class="meta">${esc(x.scan_status)} · ${fmt(x.last_success_at)}</span><br><button class="ghost target-open" data-id="${x.id}">查看库存</button> <button class="ghost target-scan" data-id="${x.id}">立即扫描</button> <button class="ghost target-delete" data-id="${x.id}">删除目标</button></div>`).join('');$('adminTargets').querySelectorAll('.target-open').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.id),true));$('adminTargets').querySelectorAll('.target-scan').forEach(b=>b.onclick=()=>adminTargetAction(Number(b.dataset.id),'scan'));$('adminTargets').querySelectorAll('.target-delete').forEach(b=>b.onclick=()=>adminTargetAction(Number(b.dataset.id),'delete'))}
async function adminPatchUser(id,data){try{await api(`api/admin/users/${id}`,{method:'PATCH',body:JSON.stringify(data)});await loadAdmin()}catch(err){alert(err.message)}}async function adminTargetAction(id,action){try{if(action==='delete'&&!confirm('删除该目标、全部订阅和快照？'))return;await api(`api/admin/targets/${id}${action==='scan'?'/scan':''}`,{method:action==='scan'?'POST':'DELETE'});await loadAdmin();await loadMonitors()}catch(err){alert(err.message)}}
$('loginTab').onclick=()=>setAuthMode(false);$('registerTab').onclick=()=>setAuthMode(true);$('authForm').onsubmit=async e=>{e.preventDefault();try{const path=state.register?'api/auth/register':'api/auth/login';const d=await api(path,{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});if(state.register){$('authMessage').className='success';$('authMessage').textContent='注册成功，请登录';setAuthMode(false)}else{state.csrf=d.csrf_token;await boot()}}catch(err){$('authMessage').className='error';$('authMessage').textContent=err.message}};
$('logout').onclick=async()=>{await api('api/auth/logout',{method:'POST'});location.reload()};$('changePassword').onclick=async()=>{const old_password=prompt('输入当前密码');if(old_password===null)return;const new_password=prompt('输入至少 8 位的新密码');if(!new_password)return;try{await api('api/auth/password',{method:'POST',body:JSON.stringify({old_password,new_password})});alert('密码已修改')}catch(err){alert(err.message)}};$('addMonitor').onclick=async()=>{try{const d=await api('api/monitors',{method:'POST',body:JSON.stringify({steamid:$('steamid').value.trim()})});msg(d.job_id?'已添加，首次扫描已进入队列':'已添加并复用最近快照',true);$('steamid').value='';await loadMonitors()}catch(err){msg(err.message)}};$('prev').onclick=async()=>{if(state.page>1){state.page--;await loadMonitors()}};$('next').onclick=async()=>{if(state.page<state.pages){state.page++;await loadMonitors()}};$('closeDetail').onclick=()=>$('detail').classList.add('hidden');$('deleteMonitor').onclick=async()=>{if(!state.currentTarget||!confirm('取消此监控？最后一个订阅取消后将删除全部快照。'))return;try{await api(`api/monitors/${state.currentTarget}`,{method:'DELETE'});$('detail').classList.add('hidden');await loadMonitors()}catch(err){alert(err.message)}};$('history').onchange=async()=>{const d=await api(`api/monitors/${state.currentTarget}/snapshots/${$('history').value}`);renderSnapshot(d.snapshot,d.diff)};$('adminQuery').onclick=async()=>{try{const d=await api('api/admin/query',{method:'POST',body:JSON.stringify({steamid:$('adminSteamid').value.trim()})});$('adminQueryResult').textContent=`任务 #${d.job_id} 已进入队列`;setTimeout(()=>pollJob(d.job_id),2000)}catch(err){$('adminQueryResult').textContent=err.message}};async function pollJob(id){try{const d=await api(`api/jobs/${id}`);if(d.status==='completed'){$('adminQueryResult').textContent=`完成：${d.result.total_items} 件，${d.result.item_types} 种`;return}if(d.status==='failed'){$('adminQueryResult').textContent=d.error;return}setTimeout(()=>pollJob(id),2500)}catch(err){$('adminQueryResult').textContent=err.message}}
boot().catch(err=>{$('authMessage').className='error';$('authMessage').textContent=err.message});
</script></body></html>
