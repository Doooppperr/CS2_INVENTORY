function renderCodes(d){$('activationCodes').innerHTML=`<table class="data-table"><thead><tr><th>\u524d\u7f00</th><th>\u5957\u9910</th><th>\u9650\u989d</th><th>\u72b6\u6001</th><th>\u521b\u5efa/\u5151\u6362</th><th>\u64cd\u4f5c</th></tr></thead><tbody>${d.items.map(x=>`<tr><td><b>${esc(x.prefix)}...</b></td><td>${esc(x.plan)}</td><td>${x.monitor_limit}</td><td>${esc(x.status)}</td><td>${fmt(x.created_at)}<br><span class="meta">${fmt(x.redeemed_at)}</span></td><td>${x.status==='unused'?`<button class="danger code-revoke" data-id="${x.id}">\u64a4\u9500</button>`:'-'}</td></tr>`).join('')}</tbody></table>`;$('activationCodes').querySelectorAll('.code-revoke').forEach(b=>b.onclick=()=>busy(b,'...',async()=>{try{await api(`api/admin/activation-codes/${b.dataset.id}`,{method:'DELETE'});toast('\u9080\u8bf7\u7801\u5df2\u64a4\u9500');await loadAdmin()}catch(e){toast(e.message,false)}}))}
const adminPatch=(id,data)=>api(`api/admin/users/${id}`,{method:'PATCH',body:JSON.stringify(data)});function openPassword(id,name){state.resetUserId=id;$('passwordDialogUser').textContent=`\u7528\u6237\uff1a${name}`;$('adminNewPassword').value='';$('passwordDialog').showModal()}function openRemark(id,steamid,remark){state.remarkTargetId=id;$('remarkTarget').textContent=`SteamID: ${steamid}`;$('remarkInput').value=remark||'';$('remarkDialog').showModal()}async function pollJob(id){try{const d=await api(`api/jobs/${id}`);if(d.status==='completed'){$('adminQueryResult').textContent=d.result?.total_items!=null?`\u5b8c\u6210\uff1a${d.result.total_items} \u4ef6\uff0c${d.result.item_types} \u79cd`:'\u626b\u63cf\u5df2\u5b8c\u6210';toast('\u67e5\u8be2\u5df2\u5b8c\u6210');return}if(d.status==='failed'||d.status==='cancelled'){$('adminQueryResult').textContent=d.error;return}setTimeout(()=>pollJob(id),2500)}catch(e){$('adminQueryResult').textContent=e.message}}
$('loginTab').onclick=()=>setAuthMode(false);$('registerTab').onclick=()=>setAuthMode(true);$('authForm').onsubmit=async e=>{e.preventDefault();try{const p=state.register?'api/auth/register':'api/auth/login',d=await api(p,{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});if(state.register){$('authMessage').textContent='\u6ce8\u518c\u6210\u529f\uff0c\u8bf7\u767b\u5f55';setAuthMode(false)}else{state.csrf=d.csrf_token;await boot()}}catch(x){$('authMessage').className='error';$('authMessage').textContent=x.message}};$('monitorTab').onclick=()=>rootView('monitors');$('adminTab').onclick=()=>{state.adminSection='overview';rootView('admin')};$('adminNav').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.adminSection=b.dataset.section;loadAdmin()});$('homeLink').onclick=()=>location.href=appUrl('');$('logout').onclick=async()=>{await api('api/auth/logout',{method:'POST'});location.href=appUrl('')};$('changePassword').onclick=async()=>{const old_password=prompt('\u8f93\u5165\u5f53\u524d\u5bc6\u7801');if(old_password===null)return;const new_password=prompt('\u8f93\u5165\u81f3\u5c11 8 \u4f4d\u7684\u65b0\u5bc6\u7801');if(!new_password)return;try{await api('api/auth/password',{method:'POST',body:JSON.stringify({old_password,new_password})});toast('\u5bc6\u7801\u5df2\u4fee\u6539')}catch(e){toast(e.message,false)}};
$('addMonitor').onclick=()=>busy($('addMonitor'),'...',async()=>{try{const d=await api('api/monitors',{method:'POST',body:JSON.stringify({steamid:$('steamid').value.trim()})});msg(d.job_id?'\u5df2\u6dfb\u52a0\uff0c\u9996\u6b21\u626b\u63cf\u5df2\u8fdb\u5165\u961f\u5217':'\u5df2\u6dfb\u52a0\u5e76\u590d\u7528\u6700\u8fd1\u5feb\u7167',true);$('steamid').value='';await loadMonitors()}catch(e){msg(e.message)}});$('prev').onclick=async()=>{if(state.page>1){state.page--;syncRootUrl();await loadMonitors()}};$('next').onclick=async()=>{if(state.page<state.pages){state.page++;syncRootUrl();await loadMonitors()}};$('backDetail').onclick=()=>location.href=state.detailSource==='admin'?rootStateUrl('admin'):rootStateUrl('monitors');$('deleteMonitor').onclick=()=>{if(state.currentTarget&&confirm('\u53d6\u6d88\u6b64\u76d1\u63a7\uff1f'))busy($('deleteMonitor'),'...',async()=>{try{await api(`api/monitors/${state.currentTarget}`,{method:'DELETE'});location.href=rootStateUrl('monitors')}catch(e){toast(e.message,false)}})};$('itemSearch').oninput=renderItems;$('compareSwitch').querySelectorAll('button').forEach(b=>b.onclick=()=>loadComparison(Number(b.dataset.days)));
$('userPrev').onclick=async()=>{if(state.adminUserPage>1){state.adminUserPage--;syncRootUrl();await loadAdmin()}};$('userNext').onclick=async()=>{if(state.adminUserPage<state.adminUserPages){state.adminUserPage++;syncRootUrl();await loadAdmin()}};$('targetPrev').onclick=async()=>{if(state.adminTargetPage>1){state.adminTargetPage--;syncRootUrl();await loadAdmin()}};$('targetNext').onclick=async()=>{if(state.adminTargetPage<state.adminTargetPages){state.adminTargetPage++;syncRootUrl();await loadAdmin()}};$('passwordCancel').onclick=()=>$('passwordDialog').close();$('passwordResetForm').onsubmit=async e=>{e.preventDefault();await busy($('passwordConfirm'),'...',async()=>{try{await adminPatch(state.resetUserId,{new_password:$('adminNewPassword').value});$('passwordDialog').close();toast('\u5bc6\u7801\u5df2\u91cd\u7f6e\u5e76\u53ef\u5728\u5217\u8868\u4e2d\u67e5\u770b');await loadAdmin()}catch(x){toast(x.message,false)}})};$('remarkCancel').onclick=()=>$('remarkDialog').close();$('remarkForm').onsubmit=async e=>{e.preventDefault();await busy($('remarkSave'),'...',async()=>{try{await api(`api/monitors/${state.remarkTargetId}`,{method:'PATCH',body:JSON.stringify({remark:$('remarkInput').value})});$('remarkDialog').close();toast('\u5907\u6ce8\u5df2\u66f4\u65b0');await loadMonitors()}catch(x){toast(x.message,false)}})};$('redeemCode').onclick=()=>busy($('redeemCode'),'...',async()=>{try{await api('api/activation/redeem',{method:'POST',body:JSON.stringify({code:$('activationCode').value.trim()})});toast('\u6fc0\u6d3b\u6210\u529f');location.reload()}catch(e){toast(e.message,false)}});$('createCode').onclick=()=>busy($('createCode'),'...',async()=>{try{const d=await api('api/admin/activation-codes',{method:'POST',body:JSON.stringify({plan:$('codePlan').value,monitor_limit:Number($('codeLimit').value)})});$('createdCode').textContent=`\u8bf7\u7acb\u5373\u590d\u5236\uff0c\u5b8c\u6574\u9080\u8bf7\u7801\u53ea\u663e\u793a\u4e00\u6b21\uff1a${d.code}`;toast('\u9080\u8bf7\u7801\u5df2\u751f\u6210');await loadAdmin()}catch(e){toast(e.message,false)}});$('adminQuery').onclick=()=>busy($('adminQuery'),'...',async()=>{try{const d=await api('api/admin/query',{method:'POST',body:JSON.stringify({steamid:$('adminSteamid').value.trim()})});$('adminQueryResult').textContent=`\u4efb\u52a1 #${d.job_id} \u5df2\u8fdb\u5165\u961f\u5217`;toast('\u67e5\u8be2\u4efb\u52a1\u5df2\u8fdb\u5165\u961f\u5217');setTimeout(()=>pollJob(d.job_id),2000)}catch(e){$('adminQueryResult').textContent=e.message;toast(e.message,false)}});boot().catch(e=>{toast(e.message,false)});
</script></body></html>
