<script>
const T={login:'\u767b\u5f55',register:'\u6ce8\u518c',ready:'\u5c31\u7eea',queued:'\u6392\u961f\u4e2d',running:'\u626b\u63cf\u4e2d',failed:'\u5931\u8d25',pending:'\u7b49\u5f85\u626b\u63cf',unknown:'\u672a\u77e5'};
const params=new URLSearchParams(location.search),positiveInt=(value,fallback=1)=>{const parsed=Number.parseInt(value,10);return Number.isInteger(parsed)&&parsed>0?parsed:fallback},validAdminSection=value=>['overview','users','targets'].includes(value)?value:'overview';
const state={csrf:'',user:null,page:positiveInt(params.get('page')),pages:1,register:false,currentView:'monitors',currentTarget:null,detail:null,comparison:null,detailSource:params.get('source')==='admin'?'admin':'monitors',adminSection:validAdminSection(params.get('section')),adminUserPage:positiveInt(params.get('user_page')),adminUserPages:1,adminTargetPage:positiveInt(params.get('target_page')),adminTargetPages:1,resetUserId:null};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const detailMatch=location.pathname.match(/\/monitors\/(\d+)\/?$/);let basePath=location.pathname.replace(/monitors\/\d+\/?$/,'');if(!basePath.endsWith('/'))basePath+='/';const appUrl=path=>basePath+String(path).replace(/^\//,'');
async function api(path,options={}){options.headers={...(options.headers||{}),'X-CSRF-Token':state.csrf};if(options.body&&!options.headers['Content-Type'])options.headers['Content-Type']='application/json';const r=await fetch(appUrl(path),options);const d=await r.json().catch(()=>({error:'\u54cd\u5e94\u683c\u5f0f\u9519\u8bef'}));if(!r.ok)throw new Error(d.error||`\u8bf7\u6c42\u5931\u8d25 ${r.status}`);return d}
function fmt(v){return v?new Date(v).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'--'}function norm(v){return String(v||'').toLocaleLowerCase('zh-CN').trim()}function statusText(s){return T[s]||s||T.unknown}function toast(text,ok=true){const e=$('toast');e.textContent=text;e.className=`toast ${ok?'ok':'bad'}`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hidden'),3200)}function msg(text,ok=false){$('message').className=ok?'success':'error';$('message').textContent=text||''}async function busy(b,text,fn){const old=b.textContent;b.disabled=true;b.textContent=text;try{return await fn()}finally{b.disabled=false;b.textContent=old}}
function rootStateUrl(view=state.currentView){const next=new URLSearchParams();next.set('view',view);if(view==='monitors')next.set('page',String(state.page));else{next.set('section',state.adminSection);if(state.adminSection==='users')next.set('user_page',String(state.adminUserPage));if(state.adminSection==='targets')next.set('target_page',String(state.adminTargetPage))}return appUrl(`?${next}`)}function syncRootUrl(){if(!detailMatch)history.replaceState(null,'',rootStateUrl())}
function setAuthMode(r){state.register=r;$('loginTab').classList.toggle('active',!r);$('registerTab').classList.toggle('active',r);$('loginTab').classList.toggle('ghost',r);$('registerTab').classList.toggle('ghost',!r);$('authSubmit').textContent=r?T.register:T.login}
function showAdminSection(section){state.adminSection=validAdminSection(section);['overview','users','targets'].forEach(name=>{const active=name===state.adminSection;$(`admin${name[0].toUpperCase()+name.slice(1)}Page`).classList.toggle('hidden',!active);const tab=$(`admin${name[0].toUpperCase()+name.slice(1)}Tab`);tab.classList.toggle('active',active);tab.classList.toggle('ghost',!active)})}
function showView(v){state.currentView=v;$('monitorView').classList.toggle('hidden',v!=='monitors');$('adminView').classList.toggle('hidden',v!=='admin');$('detailView').classList.toggle('hidden',v!=='detail');$('mainTabs').classList.toggle('hidden',v==='detail'||state.user?.role!=='admin');$('monitorTab').classList.toggle('active',v==='monitors');$('monitorTab').classList.toggle('ghost',v!=='monitors');$('adminTab').classList.toggle('active',v==='admin');$('adminTab').classList.toggle('ghost',v!=='admin');if(v==='admin')showAdminSection(state.adminSection)}
async function rootView(v){if(v==='admin'&&state.user?.role!=='admin')v='monitors';showView(v);syncRootUrl();if(v==='admin')await loadAdmin();else await loadMonitors()}
async function boot(){const d=await api('api/bootstrap');state.csrf=d.csrf_token;state.user=d.user;$('maintenance').classList.toggle('hidden',!d.maintenance);$('maintenance').textContent=d.maintenance_message;if(!state.user){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent=`${state.user.username} - ${state.user.role==='admin'?'\u7ba1\u7406\u5458':'\u7528\u6237'}`;if(detailMatch){showView('detail');await openDetail(Number(detailMatch[1]));return}const requested=params.get('view')||(location.hash==='#admin'?'admin':'monitors');await rootView(requested)}
async function loadMonitors(){const d=await api(`api/monitors?page=${state.page}`);state.page=d.page;state.pages=Math.max(1,d.pages);syncRootUrl();$('myCount').textContent=d.total;$('lastScan').textContent=fmt(d.latest_scan_at);$('pageLabel').textContent=`${state.page} / ${state.pages}`;$('prev').disabled=state.page<=1;$('next').disabled=state.page>=state.pages;$('monitorList').innerHTML=d.items.length?d.items.map(x=>`<button class="monitor-row" data-id="${x.id}"><span class="monitor-name">${esc(x.label)}</span><span class="row-status"><span class="status ${esc(x.scan_status)}">${esc(statusText(x.scan_status))}</span></span><span class="row-count">${x.latest?x.latest.total_items:'--'} \u4ef6</span><span class="row-time meta">${fmt(x.last_scan_at)}</span><span class="chevron">&rsaquo;</span></button>`).join(''):'<div class="empty">\u5c1a\u672a\u6dfb\u52a0\u76d1\u63a7\u3002</div>';$('monitorList').querySelectorAll('.monitor-row').forEach(e=>e.onclick=()=>location.href=appUrl(`monitors/${e.dataset.id}?source=monitors&page=${state.page}`))}
async function openDetail(id){const d=await api(`api/monitors/${id}`);state.currentTarget=id;state.detail=d;$('deleteMonitor').classList.toggle('hidden',state.user.role==='admin'&&state.detailSource==='admin');$('detailTitle').textContent=d.monitor.label;$('detailMeta').textContent=d.monitor.last_error||`\u6700\u8fd1\u626b\u63cf\uff1a${fmt(d.monitor.last_scan_at)}`;const s=d.snapshot;$('detailTotal').textContent=s?.total_items??0;$('detailTypes').textContent=s?.item_types??0;$('detailElapsed').textContent=s?`${(s.elapsed_ms/1000).toFixed(1)}s`:'--';$('detailTime').textContent=fmt(s?.scanned_at);$('itemSearch').value='';renderItems();await loadComparison(1)}
function renderItems(){const q=norm($('itemSearch').value),src=state.detail?.snapshot?.items||[],rows=src.filter(x=>norm(x.name).includes(q));$('itemResultMeta').textContent=q?`\u627e\u5230 ${rows.length} \u9879\u5339\u914d\u7ed3\u679c`:`\u5171 ${new Set(rows.map(x=>norm(x.name))).size} \u79cd\u7269\u54c1`;$('itemRows').innerHTML=rows.length?rows.map(x=>`<div class="item-row ${x.is_trade_protected?'protected-item':''}"><span><span class="item-name">${esc(x.name)}</span>${x.is_trade_protected?'<span class="protected-badge">\u5904\u4e8e\u4ea4\u6613\u4fdd\u62a4\u6216\u8fd1\u65e5\u521a\u7ed3\u675f</span>':''}</span><span class="qty">x ${x.count}</span></div>`).join(''):'<div class="empty">\u6ca1\u6709\u5339\u914d\u7684\u7269\u54c1</div>'}
async function loadComparison(days){$('compareSwitch').querySelectorAll('button').forEach(b=>{const active=Number(b.dataset.days)===days;b.classList.toggle('active',active);b.classList.toggle('ghost',!active);b.disabled=true});$('compareContent').innerHTML='<p class="meta">Loading...</p>';try{state.comparison=await api(`api/monitors/${state.currentTarget}/compare?days=${days}`);renderComparison()}catch(e){$('compareContent').innerHTML=`<p class="error">${esc(e.message)}</p>`}finally{$('compareSwitch').querySelectorAll('button').forEach(b=>b.disabled=false)}}
function renderComparison(){const d=state.comparison;if(!d?.current){$('compareContent').innerHTML='<p class="meta">\u9996\u6b21\u626b\u63cf\u5c1a\u672a\u5b8c\u6210\u3002</p>';return}if(!d.baseline||!d.diff){$('compareContent').innerHTML=`<p class="meta">\u6682\u65e0 ${d.days} \u5929\u524d\u5feb\u7167\uff0c\u5f53\u524d\u5feb\u7167\u65f6\u95f4\uff1a${fmt(d.current.scanned_at)}</p>`;return}const rows=[...d.diff.added.map(x=>({...x,t:'added',l:'\u65b0\u589e',v:`x ${x.count}`})),...d.diff.removed.map(x=>({...x,t:'removed',l:'\u79fb\u9664',v:`x ${x.count}`})),...d.diff.changed.map(x=>({...x,t:'changed',l:'\u6570\u91cf\u53d8\u5316',v:`${x.before} -> ${x.after}`}))];$('compareContent').innerHTML=`<div class="meta">${fmt(d.baseline.scanned_at)} -> ${fmt(d.current.scanned_at)}</div><div class="compare-summary"><div><span class="meta">\u65b0\u589e</span><br><b>${d.diff.added.length}</b></div><div><span class="meta">\u79fb\u9664</span><br><b>${d.diff.removed.length}</b></div><div><span class="meta">\u6570\u91cf\u53d8\u5316</span><br><b>${d.diff.changed.length}</b></div></div><div class="items" style="margin-top:14px">${rows.length?rows.map(x=>`<div class="item-row diff-row"><span class="diff-badge ${x.t}">${x.l}</span><span>${esc(x.name)}</span><span class="qty">${x.v}</span></div>`).join(''):'<div class="empty">\u8fd9\u6bb5\u65f6\u95f4\u5185\u6ca1\u6709\u5e93\u5b58\u53d8\u5316</div>'}</div>`}
async function loadAdmin(){showAdminSection(state.adminSection);syncRootUrl();if(state.adminSection==='overview'){const s=await api('api/admin/status');$('adminStatus').innerHTML=`<div class="stat"><span>\u5e73\u53f0\u76d1\u63a7\uff08\u53c2\u8003\u503c\uff0c\u53ef\u8d85\uff09</span><b>${s.targets}/${s.target_limit}</b></div><div class="stat"><span>\u7b49\u5f85\u4efb\u52a1</span><b>${s.pending_jobs}</b></div><div class="stat"><span>\u4eca\u65e5\u989d\u5ea6\uff08\u4ec5\u7edf\u8ba1\uff0c\u53ef\u8d85\uff09</span><b>${s.quota.daily_used}/${s.quota.daily_budget}</b></div><div class="stat"><span>\u8d26\u671f\u989d\u5ea6</span><b>${s.quota.billing_used}/${s.quota.billing_budget}</b></div>`;return}if(state.adminSection==='users'){const d=await api(`api/admin/users?page=${state.adminUserPage}`);state.adminUserPage=d.page;state.adminUserPages=Math.max(1,d.pages);syncRootUrl();renderUsers(d);return}const d=await api(`api/admin/targets?page=${state.adminTargetPage}`);state.adminTargetPage=d.page;state.adminTargetPages=Math.max(1,d.pages);syncRootUrl();renderTargets(d)}
function renderUsers(d){$('userPageLabel').textContent=`${state.adminUserPage} / ${state.adminUserPages}`;$('userPrev').disabled=state.adminUserPage<=1;$('userNext').disabled=state.adminUserPage>=state.adminUserPages;$('users').innerHTML=`<table class="data-table"><thead><tr><th>\u7528\u6237</th><th>\u76d1\u63a7</th><th>\u5f53\u524d\u5bc6\u7801</th><th>\u6539\u5bc6\u65f6\u95f4</th><th>\u64cd\u4f5c</th></tr></thead><tbody>${d.items.map(x=>`<tr><td><b>${esc(x.username)}</b><br><span class="meta">${esc(x.role)} - ${x.steamids.map(esc).join(', ')||'\u65e0 SteamID'}</span></td><td>${x.monitor_count}</td><td class="password-cell">${x.password_available?esc(x.password):'<span class="meta">\u5386\u53f2\u5bc6\u7801\u4e0d\u53ef\u8bfb\u53d6</span>'}</td><td>${fmt(x.password_changed_at)}</td><td><div class="actions">${x.id===state.user.id?'<span class="meta">\u5f53\u524d\u8d26\u53f7</span>':`<button class="danger user-delete" data-id="${x.id}" data-name="${esc(x.username)}">\u5220\u9664\u8d26\u53f7</button>`}<button class="outline-primary user-reset" data-id="${x.id}" data-name="${esc(x.username)}">\u91cd\u7f6e\u5bc6\u7801</button></div></td></tr>`).join('')}</tbody></table>`;$('users').querySelectorAll('.user-delete').forEach(b=>b.onclick=()=>{if(confirm(`\u6c38\u4e45\u5220\u9664\u8d26\u53f7 ${b.dataset.name}\uff1f\u5171\u4eab\u76ee\u6807\u4fdd\u7559\uff0c\u65e0\u4e3b\u76ee\u6807\u548c\u5feb\u7167\u5c06\u4e00\u5e76\u5220\u9664\u3002`))busy(b,'...',async()=>{try{const result=await api(`api/admin/users/${b.dataset.id}`,{method:'DELETE'});toast(`\u8d26\u53f7\u5df2\u5220\u9664\uff0c\u6e05\u7406 ${result.deleted_targets} \u4e2a\u65e0\u4e3b\u76ee\u6807`);await loadAdmin()}catch(e){toast(e.message,false)}})});$('users').querySelectorAll('.user-reset').forEach(b=>b.onclick=()=>openPassword(Number(b.dataset.id),b.dataset.name))}
function renderTargets(d){$('targetPageLabel').textContent=`${state.adminTargetPage} / ${state.adminTargetPages}`;$('targetPrev').disabled=state.adminTargetPage<=1;$('targetNext').disabled=state.adminTargetPage>=state.adminTargetPages;$('adminTargets').innerHTML=`<table class="data-table"><thead><tr><th>\u76d1\u63a7\u76ee\u6807</th><th>\u8ba2\u9605</th><th>\u72b6\u6001</th><th>\u5e93\u5b58</th><th>\u6700\u8fd1\u626b\u63cf</th><th>\u64cd\u4f5c</th></tr></thead><tbody>${d.items.map(x=>`<tr><td><b>${esc(x.label)}</b></td><td>${x.subscriber_count}</td><td><span class="status ${esc(x.scan_status)}">${esc(statusText(x.scan_status))}</span></td><td>${x.latest?x.latest.total_items:'--'} \u4ef6</td><td>${fmt(x.last_scan_at)}</td><td><div class="actions"><button class="outline-primary target-open" data-id="${x.id}">\u67e5\u770b\u5e93\u5b58</button><button class="target-scan" data-id="${x.id}">\u7acb\u5373\u626b\u63cf</button><button class="danger target-delete" data-id="${x.id}">\u5220\u9664\u76ee\u6807</button></div></td></tr>`).join('')}</tbody></table>`;$('adminTargets').querySelectorAll('.target-open').forEach(b=>b.onclick=()=>location.href=appUrl(`monitors/${b.dataset.id}?source=admin&section=targets&target_page=${state.adminTargetPage}`));$('adminTargets').querySelectorAll('.target-scan').forEach(b=>b.onclick=()=>busy(b,'...',async()=>{try{await api(`api/admin/targets/${b.dataset.id}/scan`,{method:'POST'});toast('\u626b\u63cf\u4efb\u52a1\u5df2\u8fdb\u5165\u961f\u5217');await loadAdmin()}catch(e){toast(e.message,false)}}));$('adminTargets').querySelectorAll('.target-delete').forEach(b=>b.onclick=()=>{if(confirm('\u5220\u9664\u8be5\u76ee\u6807\u3001\u5168\u90e8\u8ba2\u9605\u548c\u5feb\u7167\uff1f'))busy(b,'...',async()=>{try{await api(`api/admin/targets/${b.dataset.id}`,{method:'DELETE'});toast('\u76d1\u63a7\u76ee\u6807\u5df2\u5220\u9664');await loadAdmin()}catch(e){toast(e.message,false)}})})}
const adminPatch=(id,data)=>api(`api/admin/users/${id}`,{method:'PATCH',body:JSON.stringify(data)});function openPassword(id,name){state.resetUserId=id;$('passwordDialogUser').textContent=`\u7528\u6237\uff1a${name}`;$('adminNewPassword').value='';$('passwordDialog').showModal()}async function pollJob(id){try{const d=await api(`api/jobs/${id}`);if(d.status==='completed'){$('adminQueryResult').textContent=`\u5b8c\u6210\uff1a${d.result.total_items} \u4ef6\uff0c${d.result.item_types} \u79cd`;toast('\u5373\u65f6\u67e5\u8be2\u5df2\u5b8c\u6210');return}if(d.status==='failed'){$('adminQueryResult').textContent=d.error;return}setTimeout(()=>pollJob(id),2500)}catch(e){$('adminQueryResult').textContent=e.message}}
$('loginTab').onclick=()=>setAuthMode(false);$('registerTab').onclick=()=>setAuthMode(true);$('authForm').onsubmit=async e=>{e.preventDefault();try{const p=state.register?'api/auth/register':'api/auth/login',d=await api(p,{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});if(state.register){$('authMessage').textContent='\u6ce8\u518c\u6210\u529f\uff0c\u8bf7\u767b\u5f55';setAuthMode(false)}else{state.csrf=d.csrf_token;await boot()}}catch(x){$('authMessage').className='error';$('authMessage').textContent=x.message}};$('monitorTab').onclick=()=>rootView('monitors');$('adminTab').onclick=()=>{state.adminSection='overview';rootView('admin')};$('adminNav').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.adminSection=b.dataset.section;loadAdmin()});$('logout').onclick=async()=>{await api('api/auth/logout',{method:'POST'});location.href=appUrl('')};$('changePassword').onclick=async()=>{const old_password=prompt('\u8f93\u5165\u5f53\u524d\u5bc6\u7801');if(old_password===null)return;const new_password=prompt('\u8f93\u5165\u81f3\u5c11 8 \u4f4d\u7684\u65b0\u5bc6\u7801');if(!new_password)return;try{await api('api/auth/password',{method:'POST',body:JSON.stringify({old_password,new_password})});toast('\u5bc6\u7801\u5df2\u4fee\u6539')}catch(e){toast(e.message,false)}};
$('addMonitor').onclick=()=>busy($('addMonitor'),'...',async()=>{try{const d=await api('api/monitors',{method:'POST',body:JSON.stringify({steamid:$('steamid').value.trim()})});msg(d.job_id?'\u5df2\u6dfb\u52a0\uff0c\u9996\u6b21\u626b\u63cf\u5df2\u8fdb\u5165\u961f\u5217':'\u5df2\u6dfb\u52a0\u5e76\u590d\u7528\u6700\u8fd1\u5feb\u7167',true);$('steamid').value='';await loadMonitors()}catch(e){msg(e.message)}});$('prev').onclick=async()=>{if(state.page>1){state.page--;syncRootUrl();await loadMonitors()}};$('next').onclick=async()=>{if(state.page<state.pages){state.page++;syncRootUrl();await loadMonitors()}};$('backDetail').onclick=()=>location.href=state.detailSource==='admin'?rootStateUrl('admin'):rootStateUrl('monitors');$('deleteMonitor').onclick=()=>{if(state.currentTarget&&confirm('\u53d6\u6d88\u6b64\u76d1\u63a7\uff1f'))busy($('deleteMonitor'),'...',async()=>{try{await api(`api/monitors/${state.currentTarget}`,{method:'DELETE'});location.href=rootStateUrl('monitors')}catch(e){toast(e.message,false)}})};$('itemSearch').oninput=renderItems;$('compareSwitch').querySelectorAll('button').forEach(b=>b.onclick=()=>loadComparison(Number(b.dataset.days)));
$('userPrev').onclick=async()=>{if(state.adminUserPage>1){state.adminUserPage--;syncRootUrl();await loadAdmin()}};$('userNext').onclick=async()=>{if(state.adminUserPage<state.adminUserPages){state.adminUserPage++;syncRootUrl();await loadAdmin()}};$('targetPrev').onclick=async()=>{if(state.adminTargetPage>1){state.adminTargetPage--;syncRootUrl();await loadAdmin()}};$('targetNext').onclick=async()=>{if(state.adminTargetPage<state.adminTargetPages){state.adminTargetPage++;syncRootUrl();await loadAdmin()}};$('passwordCancel').onclick=()=>$('passwordDialog').close();$('passwordResetForm').onsubmit=async e=>{e.preventDefault();await busy($('passwordConfirm'),'...',async()=>{try{await adminPatch(state.resetUserId,{new_password:$('adminNewPassword').value});$('passwordDialog').close();toast('\u5bc6\u7801\u5df2\u91cd\u7f6e\u5e76\u53ef\u5728\u5217\u8868\u4e2d\u67e5\u770b');await loadAdmin()}catch(x){toast(x.message,false)}})};$('adminQuery').onclick=()=>busy($('adminQuery'),'...',async()=>{try{const d=await api('api/admin/query',{method:'POST',body:JSON.stringify({steamid:$('adminSteamid').value.trim()})});$('adminQueryResult').textContent=`\u4efb\u52a1 #${d.job_id} \u5df2\u8fdb\u5165\u961f\u5217`;toast('\u67e5\u8be2\u4efb\u52a1\u5df2\u8fdb\u5165\u961f\u5217');setTimeout(()=>pollJob(d.job_id),2000)}catch(e){$('adminQueryResult').textContent=e.message;toast(e.message,false)}});boot().catch(e=>{$('authMessage').className='error';$('authMessage').textContent=e.message});
</script></body></html>
