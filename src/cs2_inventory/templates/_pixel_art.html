  <rect class="px-shadow" x="10" y="54" width="46" height="5"/><rect class="px-ink" x="6" y="18" width="52" height="36"/><rect class="px-accent" x="11" y="23" width="42" height="26"/><rect class="px-paper" x="16" y="28" width="32" height="5"/><rect class="px-ink" x="27" y="34" width="10" height="9"/><rect class="px-accent-2" x="30" y="36" width="4" height="5"/>
