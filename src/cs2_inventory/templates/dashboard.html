<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日库存看板 · CS2 Inventory Monitor</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fa;--card:#fff;--text:#182237;--muted:#58657b;--line:#d9e0ec;--accent:#2459c5}
@media(prefers-color-scheme:dark){:root{--bg:#111722;--card:#1b2433;--text:#ecf1fa;--muted:#b0bdd2;--line:#364358;--accent:#8db3ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0;font-size:27px}h2{font-size:19px}.muted{color:var(--muted)}a{color:var(--accent)}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:18px 0}.filters{display:flex;flex-wrap:wrap;align-items:end;gap:14px}label{display:flex;flex-direction:column;gap:4px;font-size:13px}label.check{flex-direction:row;align-items:center}input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:8px}input[type=number]{width:90px}input[type=checkbox]{width:18px;height:18px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:#2459c5;color:white;border-color:#2459c5}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px}.stat b{display:block;font-size:24px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:660px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px}th{color:var(--muted);font-weight:500}.positive{color:#12815c}.negative{color:#d55349}summary{cursor:pointer;font-weight:600}details p{margin:8px 0}details table{font-size:13px}.pager{display:flex;justify-content:center;gap:15px;align-items:center;margin:20px}.error{color:#d55349}.hidden{display:none!important}.badge{padding:3px 9px;border:1px solid var(--line);border-radius:15px;font-size:12px}.help{border-left:3px solid var(--accent);padding-left:12px}
@media(max-width:650px){main{padding:16px 12px}header{align-items:start}h1{font-size:22px}.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}.filters>*{max-width:100%}input[type=search]{width:100%}header a{white-space:nowrap}.table-wrap{margin-right:-6px}}
</style></head><body><main id="dashboard" data-api="{{ url_for('daily_dashboard') }}" data-bootstrap="{{ url_for('bootstrap') }}" data-app="{{ url_for('application') }}" data-home="{{ url_for('index') }}">
<header><div><h1>每日库存看板</h1><div class="muted">早间深度对比 · 北京时间 · 保留 8 天</div></div><a href="{{ url_for('application') }}">返回我的监控</a></header>
<p id="viewer" class="muted">正在验证登录状态…</p>
<form id="filters" class="panel">
<div class="filters"><label>日报日期<input id="date" name="date" type="date" required></label><label id="scopeLabel" class="hidden">监控范围<select name="scope" id="scope"><option value="mine">我的监控</option><option value="all">全部目标</option></select></label><label>查看区域<select id="section" name="section"><option value="signals">全部有效变动</option><option value="reappeared">再次出现</option><option value="pending">待核实观察</option></select></label><label>饰品搜索<input type="search" name="q" placeholder="中文或市场名称"></label><label>排序<select name="sort"><option value="accounts">增加账号数</option><option value="increase">合计增加件数</option><option value="max">单账号最大增加</option><option value="decrease">合计减少件数</option></select></label></div>
<fieldset id="signalFilters" style="border:0;padding:0;margin-top:18px"><legend class="muted">加仓快捷筛选（不勾选时展示全部）</legend><div class="filters"><label class="check"><input type="checkbox" name="peers" value="1">多人共同增加</label><label>至少账号数<input name="min_accounts" type="number" min="1" max="1000000" value="2"></label><label>每账号至少增加<input name="min_per_account" type="number" min="1" max="1000000" value="1"></label><label class="check"><input type="checkbox" name="single" value="1">单账号增加多件</label><label>至少增加件数<input name="min_single" type="number" min="1" max="1000000" value="2"></label><label>条件组合<select name="match"><option value="any">满足任一</option><option value="all">同时满足</option></select></label><label>变动方向<select name="direction"><option value="all">全部</option><option value="increase">增加榜</option><option value="decrease">集中减少榜</option></select></label></div></fieldset>
<div style="margin-top:16px"><button class="primary" id="apply">应用筛选</button> <span class="muted">筛选与刷新只读本地记录，不调用库存 API。</span></div></form>
<p id="error" class="error" role="alert"></p><div id="stats" class="stats"></div>
<section class="panel" aria-live="polite"><h2 id="title">每日变动</h2><p id="quality" class="muted help"></p><div id="rows" class="table-wrap"></div><div class="pager"><button id="prev">上一页</button><span id="page">—</span><button id="next">下一页</button></div></section>
<p id="note" class="muted"></p>
</main><script src="{{ url_for('static', filename='dashboard.js') }}" defer></script></body></html>
